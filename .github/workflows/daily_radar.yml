name: Daily TechRadar Automated Pipeline

on:
  schedule:
    # 每天 UTC 00:00 (北京时间 08:00) 自动触发
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持手动点击一键运行

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run TechRadar Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python cli.py run --max-items 2

      - name: Commit and Push Vault Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/vault/ output/digests/ data/state_store.db
          git commit -m "chore(radar): automated daily ingestion [skip ci]" || echo "No changes to commit"
          git push
